<div class="app-shell" [class.drawer-collapsed]="isDrawerCollapsed">

  <!-- Side Drawer -->
  <nav class="side-drawer">

    <div class="drawer-header">
      <div class="drawer-logo">
        <svg class="drawer-logo-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="drawer-app-name">Kafka Tools</span>
      </div>
      <button class="drawer-toggle" (click)="toggleDrawer()" [title]="isDrawerCollapsed ? 'Expand' : 'Collapse'">
        <svg class="drawer-toggle-icon" [class.flipped]="isDrawerCollapsed" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <ul class="nav-list">

      <li>
        <a class="nav-item"
           routerLink="/"
           routerLinkActive="nav-item-active"
           [routerLinkActiveOptions]="{exact: true}"
           [title]="isDrawerCollapsed ? 'Publisher' : ''">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Publisher</span>
        </a>
      </li>

      <li>
        <a class="nav-item"
           routerLink="/shaper"
           routerLinkActive="nav-item-active"
           [title]="isDrawerCollapsed ? 'Traffic Shaper' : ''">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
            <path d="M22 3L2 3L10 12.46V19L14 21V12.46L22 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Traffic Shaper</span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- Page Content -->
  <main class="page-content">
    <router-outlet />
  </main>

</div>
